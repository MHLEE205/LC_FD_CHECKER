<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LC/FD/SI 체크 v6.1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;--accent:#4f7cff;--accent2:#7c4fff;--ok:#22c55e;--ng:#ef4444;--warn:#f59e0b;--text:#e8eaf0;--sub:#8b90a8;--r:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;padding:20px 14px;}
h1{font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:3px;}
.sub{font-size:.73rem;color:var(--sub);margin-bottom:16px;}
#langScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:20px;}
.lang-title{font-size:1.1rem;font-weight:700;color:var(--sub);text-align:center;}
.lang-btns{display:flex;gap:16px;}
.lang-btn{padding:18px 36px;border:2px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;}
.lang-btn:hover{border-color:var(--accent);background:rgba(79,124,255,.1);}
.lang-btn span{display:block;font-size:.72rem;color:var(--sub);margin-top:4px;font-weight:400;}
#app{display:none;}
.lang-switch{text-align:right;margin-bottom:10px;}
.lang-switch button{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--sub);padding:4px 10px;font-size:.7rem;cursor:pointer;}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;}
.tab{flex:1;min-width:60px;padding:9px 6px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--sub);font-size:.75rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
.tab:not(.active):hover{border-color:var(--accent);color:var(--text);}
.panel{display:none;}.panel.active{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.ct{font-size:.73rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.ubox{border:2px dashed var(--border);border-radius:10px;padding:14px 8px;text-align:center;cursor:pointer;position:relative;transition:all .2s;margin-bottom:8px;}
.ubox:hover{border-color:var(--accent);background:rgba(79,124,255,.05);}
.ubox.has{border-color:var(--ok);border-style:solid;background:rgba(34,197,94,.05);}
.ubox input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.ui{font-size:1.5rem;margin-bottom:4px;}
.ul{font-size:.7rem;font-weight:600;color:var(--sub);}
.un{font-size:.66rem;color:var(--ok);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.crow label{font-size:.76rem;color:var(--sub);white-space:nowrap;}
select,input[type=text]{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:6px 9px;font-size:.78rem;outline:none;}
select:focus,input[type=text]:focus{border-color:var(--accent);}
.btn{width:100%;padding:11px;border:none;border-radius:9px;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.btn-p:hover{opacity:.88;transform:translateY(-1px);}
.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-s{background:var(--surface2);color:var(--sub);font-size:.76rem;padding:8px;border:1px solid var(--border);}
.btn-s:hover{border-color:var(--accent);color:var(--text);}
.lc-item{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all .2s;}
.lc-item:hover{border-color:var(--accent);}
.lc-item.selected{border-color:var(--ok);background:rgba(34,197,94,.07);}
.lc-head{display:flex;justify-content:space-between;align-items:center;}
.lc-title{font-size:.8rem;font-weight:700;}
.lc-meta{font-size:.68rem;color:var(--sub);margin-top:3px;}
.lc-badge{font-size:.65rem;padding:2px 8px;border-radius:10px;background:rgba(34,197,94,.15);color:var(--ok);}
.del-btn{background:rgba(239,68,68,.15);color:var(--ng);border:none;border-radius:6px;padding:3px 8px;font-size:.68rem;cursor:pointer;}
.empty{text-align:center;color:var(--sub);font-size:.78rem;padding:20px;border:1px dashed var(--border);border-radius:9px;}
.steps{display:flex;gap:4px;margin-bottom:9px;}
.step{flex:1;padding:5px;border-radius:6px;text-align:center;font-size:.67rem;font-weight:600;border:1px solid var(--border);color:var(--sub);background:var(--surface2);}
.step.active{border-color:var(--accent);color:var(--accent);background:rgba(79,124,255,.1);}
.step.done{border-color:var(--ok);color:var(--ok);background:rgba(34,197,94,.08);}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.lmsg{font-size:.78rem;color:var(--sub);padding:7px 0;}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0;}
.verdict{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.v-text{font-size:1rem;font-weight:800;}
.v-sub{font-size:.7rem;color:var(--sub);}
.srow{display:flex;gap:7px;margin-bottom:11px;}
.sc{flex:1;background:var(--surface2);border-radius:8px;padding:8px 9px;text-align:center;border:1px solid var(--border);}
.sn{font-size:1.2rem;font-weight:800;}
.sn.ok{color:var(--ok);}.sn.ng{color:var(--ng);}.sn.warn{color:var(--warn);}
.sl{font-size:.63rem;color:var(--sub);margin-top:1px;}
.sh{display:flex;align-items:center;gap:7px;margin:13px 0 5px;}
.st{font-size:.78rem;font-weight:700;}
.badge{font-size:.63rem;font-weight:700;padding:2px 7px;border-radius:10px;}
.b-ok{background:rgba(34,197,94,.15);color:var(--ok);}
.b-ng{background:rgba(239,68,68,.15);color:var(--ng);}
.b-w{background:rgba(245,158,11,.15);color:var(--warn);}
.ci{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:7px;margin-bottom:3px;background:var(--surface2);border-left:3px solid transparent;}
.ci.ok{border-left-color:var(--ok);}.ci.ng{border-left-color:var(--ng);}.ci.warn{border-left-color:var(--warn);}
.ctit{font-size:.76rem;font-weight:600;margin-bottom:1px;}
.ci.ok .ctit{color:#86efac;}.ci.ng .ctit{color:#fca5a5;}.ci.warn .ctit{color:#fcd34d;}
.cdesc{font-size:.7rem;color:var(--sub);line-height:1.5;}
.sbox{background:var(--surface2);border-radius:8px;padding:10px 12px;margin-top:4px;border:1px solid var(--border);font-size:.76rem;line-height:1.7;white-space:pre-wrap;}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:9px;padding:10px 12px;font-size:.76rem;color:#fca5a5;white-space:pre-wrap;}
table{width:100%;border-collapse:collapse;font-size:.72rem;}
th{text-align:left;padding:4px 5px;color:var(--sub);border-bottom:1px solid var(--border);}
td{padding:4px 5px;border-bottom:1px solid var(--border);}
.hist-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:all .2s;}
.hist-item:hover{border-color:var(--accent);}
.hist-head{display:flex;justify-content:space-between;align-items:center;}
.hist-title{font-size:.77rem;font-weight:600;}
.hist-meta{font-size:.66rem;color:var(--sub);margin-top:2px;}
.si-badge{font-size:.65rem;padding:2px 8px;border-radius:10px;background:rgba(79,124,255,.15);color:var(--accent);}
.si-rows-info{background:rgba(79,124,255,.08);border:1px solid rgba(79,124,255,.2);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:.75rem;}
.si-rows-info strong{color:var(--accent);}
</style>
</head>
<body>

<div id="langScreen">
  <div class="lang-title">🔍 LC / FD / SI 체크 Tool<br><span style="font-size:.85rem;font-weight:400">LEENEAR CORPORATION</span></div>
  <div class="lang-btns">
    <div class="lang-btn" onclick="initApp('ko')">🇰🇷 한국어<span>Korean</span></div>
    <div class="lang-btn" onclick="initApp('ja')">🇯🇵 日本語<span>Japanese</span></div>
  </div>
</div>

<div id="app">
  <div class="lang-switch"><button id="langSwitchBtn2" onclick="switchLang()">🌐 </button></div>
  <h1>🔍 LC / FD / SI <span id="appTitle"></span></h1>
  <p class="sub">LEENEAR CORPORATION — v6.1</p>

  <div class="tabs">
    <div class="tab active" id="tab1Label" onclick="switchTab('lc')"></div>
    <div class="tab" id="tab2Label" onclick="switchTab('fd')"></div>
    <div class="tab" id="tab3Label" onclick="switchTab('si')"></div>
    <div class="tab" id="tab4Label" onclick="switchTab('hist')"></div>
  </div>

  <!-- TAB1: LC 등록 -->
  <div class="panel active" id="tab-lc">
    <div class="card">
      <div class="ct" id="t1CardTitle"></div>
      <div class="crow">
        <label id="contractLabel"></label>
        <input type="text" id="lcContractNo" style="width:150px">
        <label id="countryLabel" style="margin-left:4px"></label>
        <select id="lcCountry"></select>
      </div>
      <div class="ubox" id="lcUpBox">
        <input type="file" id="lcUpFile" accept=".pdf,image/*" multiple onchange="hfLc(this)">
        <div class="ui">📄</div>
        <div class="ul" id="lcUpLabel"></div>
        <div class="un" id="lcUpName"></div>
      </div>
      <button class="btn btn-p" id="lcRegBtn" onclick="registerLC()" disabled></button>
    </div>
    <div class="card">
      <div class="ct" id="lcListTitle"></div>
      <div id="lcList"></div>
    </div>
    <div id="lcProg" style="display:none;margin-top:4px">
      <div class="steps"><div class="step active" id="lcs1"></div><div class="step" id="lcs2"></div></div>
      <div class="lmsg"><span class="spinner"></span><span id="lcLmsg"></span></div>
    </div>
  </div>

  <!-- TAB2: FD 대조 -->
  <div class="panel" id="tab-fd">
    <div class="card">
      <div class="ct" id="t2SelectTitle"></div>
      <div id="lcSelectList"></div>
    </div>
    <div class="card">
      <div class="ct" id="t2UpTitle"></div>
      <div class="crow">
        <label id="invLabel"></label>
        <input type="text" id="fdInvNo" style="width:170px">
      </div>
      <div class="ubox" id="fdUpBox">
        <input type="file" id="fdUpFile" accept=".pdf,image/*" multiple onchange="hfFd(this)">
        <div class="ui">📋</div>
        <div class="ul" id="fdUpLabel"></div>
        <div class="un" id="fdUpName"></div>
      </div>
      <button class="btn btn-p" id="fdGoBtn" onclick="runFD()" disabled></button>
    </div>
    <div id="fdProg" style="display:none;margin-top:4px">
      <div class="steps">
        <div class="step" id="fds1"></div>
        <div class="step" id="fds2"></div>
        <div class="step" id="fds3"></div>
      </div>
      <div class="lmsg"><span class="spinner"></span><span id="fdLmsg"></span></div>
    </div>
    <div id="fdResult" style="display:none">
      <div class="divider"></div>
      <div id="fdRc"></div>
      <button class="btn btn-s" style="margin-top:8px" id="fdNextBtn" onclick="clearFDResult()"></button>
    </div>
  </div>

  <!-- TAB3: SI 체크 -->
  <div class="panel" id="tab-si">
    <div class="card">
      <div class="ct" id="siLcSelectTitle"></div>
      <div id="siLcSelectList"></div>
    </div>
    <div class="card">
      <div class="ct" id="siUpTitle"></div>
      <div class="ubox" id="siUpBox">
        <input type="file" id="siUpFile" accept=".csv,.xlsx,.xls" onchange="hfSi(this)">
        <div class="ui">📊</div>
        <div class="ul" id="siUpLabel"></div>
        <div class="un" id="siUpName"></div>
      </div>
      <div id="siRowsInfo" style="display:none" class="si-rows-info"></div>
      <button class="btn btn-p" id="siGoBtn" onclick="runSI()" disabled></button>
    </div>
    <div id="siProg" style="display:none;margin-top:4px">
      <div class="steps">
        <div class="step" id="sis1"></div>
        <div class="step" id="sis2"></div>
        <div class="step" id="sis3"></div>
      </div>
      <div class="lmsg"><span class="spinner"></span><span id="siLmsg"></span></div>
    </div>
    <div id="siResult" style="display:none">
      <div class="divider"></div>
      <div id="siRc"></div>
      <button class="btn btn-s" style="margin-top:8px" id="siNextBtn" onclick="clearSIResult()"></button>
    </div>
  </div>

  <!-- TAB4: 이력 -->
  <div class="panel" id="tab-hist">
    <div class="card">
      <div class="ct" id="histTitle"></div>
      <div id="histList"></div>
    </div>
    <button class="btn btn-s" id="histClearBtn" onclick="clearHist()"></button>
  </div>
</div>

async function b64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});}
function mtype(f){return f.type||(f.name.endsWith('.pdf')?'application/pdf':'image/jpeg');}
async function fc(arr){
  const out=[];
  for(const f of arr){const d=await b64(f),m=mtype(f);
    out.push(m==='application/pdf'?{type:'document',source:{type:'base64',media_type:'application/pdf',data:d}}:{type:'image',source:{type:'base64',media_type:m,data:d}});}
  return out;
}
async function api(msgs,max=3500){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:max,system:SYS,messages:msgs})});
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.content.map(b=>b.text||'').join('');
}

function parseCSV(text){
  const lines=text.split('\n').filter(l=>l.trim());
  if(!lines.length)return[];
  // BOM 제거
  if(lines[0].charCodeAt(0)===0xFEFF)lines[0]=lines[0].slice(1);
  const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line=>{
    const vals=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){inQ=!inQ;}
      else if(c===','&&!inQ){vals.push(cur.trim());cur='';}
      else cur+=c;
    }
    vals.push(cur.trim());
    const obj={};
    headers.forEach((h,i)=>obj[h]=(vals[i]||'').replace(/^"|"$/g,''));
    return obj;
  });
}

function parseXLSX(buffer){
  const wb=XLSX.read(buffer,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{defval:''});
}

    let filtered=siParsedRows.filter(r=>{

    const siText=filtered.map(r=>{

    const country=lc.country;
    const cNote=country==='VIETNAM'?`【VIETNAM特記】

【チェックルール】
以下はデフォルト自動出力のためチェック不要：

チェック対象：

8. [44F] SI_POD1/2/3またはSI_PortOfDischrageがLC 44F(POD)と一致か → 不一致はNG
9. [46A] LC上に現地AGENT要件がある場合、SI_BL_LocalagentがTRUEか → FALSEならNG
10. [46A] LC上にFAX NO記載要件がある場合、SI_FAX_CONまたはSI_Shipper_FAXが入力されているか → 空ならNG
11. [VIETNAM+WASTEPAPER] SI_BL_TEXT1に「WASTE PAPER#..#XXKGS#XXBALES DEPOSIT NUMBER:XXX」形式があるか → なければNG
12. [VIETNAM] No_SIが2件以上あるか → 1件のみはWARN
13. [THAILAND] SI_ShippingMarkが入力されているか → 空ならNG
14. [47A等] SI_TEXT_ALLにALL DOCUMENTS共通必須文句が入っているか → 必要なのに空ならWARN
15. [45A/47A] SI_TEXT_INVOICEにINVOICE必須文句が入っているか → 必要なのに空ならWARN
16. [46A BENE CERT] LC上にBENEFICIARY CERTIFICATE要件があり、船積前に判明する情報がある場合、SI_TEXT_BENEが入力されているか → 空ならWARN
17. [保険] 保険はSI外の別手配。LC 46A保険条件を必ず別途確認 → 常にWARN

各チェック項目を以下の形式で出力。JSON不要。
形式: [OK/NG/WARN] カテゴリ名 > 項目名 | 説明

必ず最後に出力:
SUMMARY: （SI所見。修正必須事項を優先列挙。BL発行前に直すべきことを明確に）
OVERALL: OK または NG または WARN`;

    const raw=await api([{role:'user',content:[{type:'text',text:prompt}]}],3500);

    setS(['sis1','sis2','sis3'],3);
    document.getElementById('siLmsg').textContent=t('siStep3');
    await new Promise(r=>setTimeout(r,300));

    const result=parseAndRenderSI(raw,lc,filtered.length);
    DB.history.unshift({
      type:'SI',contractNo:lc.contractNo,invNo:siFileName,country:lc.country,
      overall:result.overall,checkedAt:new Date().toLocaleString(LANG==='ko'?'ko-KR':'ja-JP'),
      html:document.getElementById('siRc').innerHTML
    });
    document.getElementById('siProg').style.display='none';
    document.getElementById('siResult').style.display='block';
    document.getElementById('siGoBtn').disabled=false;
  }catch(e){
    document.getElementById('siProg').style.display='none';
    document.getElementById('siResult').style.display='block';
    document.getElementById('siRc').innerHTML=`<div class="err">${t('errPrefix')}${e.message}</div>`;
    document.getElementById('siGoBtn').disabled=false;
  }
}

function parseAndRenderSI(raw,lc,rowCount){
  const checkLines=raw.split('\n').filter(l=>/^\[(OK|NG|WARN)\]/.test(l.trim()));
  const summaryM=raw.match(/SUMMARY:\s*(.+?)(?=\nOVERALL:|$)/s);
  const overallM=raw.match(/OVERALL:\s*(OK|NG|WARN)/);
  const catMap={};
  checkLines.forEach(l=>{
    const m=l.trim().match(/^\[(OK|NG|WARN)\]\s*(.+?)\s*>\s*(.+?)\s*\|\s*(.*)$/);
    if(!m)return;
    const[,status,cat,title,detail]=m;
    if(!catMap[cat])catMap[cat]=[];
    catMap[cat].push({status,title,detail});
  });
  const overall=overallM?overallM[1]:'WARN';
  const summary=summaryM?summaryM[1].trim():'';
  let ok=0,ng=0,warn=0;
  Object.values(catMap).forEach(items=>items.forEach(i=>{if(i.status==='OK')ok++;else if(i.status==='NG')ng++;else warn++;}));
  const oc=overall==='OK'?'#22c55e':overall==='NG'?'#ef4444':'#f59e0b';
  const oe=overall==='OK'?'✅':overall==='NG'?'❌':'⚠️';
  let html=`<div class="verdict"><span style="font-size:1.8rem">${oe}</span>
    <div><div class="v-text" style="color:${oc}">${t('siVerdict',overall)}</div>
    <div class="v-sub">${lc.contractNo} | ${lc.country} | SI ${rowCount}件</div></div></div>
    <div class="srow">
      <div class="sc"><div class="sn ok">${ok}</div><div class="sl">${t('scoreOK')}</div></div>
      <div class="sc"><div class="sn ng">${ng}</div><div class="sl">${t('scoreNG')}</div></div>
      <div class="sc"><div class="sn warn">${warn}</div><div class="sl">${t('scoreWarn')}</div></div>
    </div>`;
  Object.entries(catMap).forEach(([cat,items])=>{
    const cn=items.filter(i=>i.status==='NG').length,cw=items.filter(i=>i.status==='WARN').length;
    const bh=cn>0?`<span class="badge b-ng">NG ${cn}</span>`:cw>0?`<span class="badge b-w">${LANG==='ko'?'요확인':'要確認'} ${cw}</span>`:`<span class="badge b-ok">OK</span>`;
    html+=`<div class="sh"><span class="st">${cat}</span>${bh}</div>`;
    items.forEach(i=>{
      const cl=i.status==='OK'?'ok':i.status==='NG'?'ng':'warn';
      const ic=i.status==='OK'?'✅':i.status==='NG'?'❌':'⚠️';
      html+=`<div class="ci ${cl}"><span style="font-size:.9rem;flex-shrink:0">${ic}</span>
        <div><div class="ctit">${i.title}</div><div class="cdesc">${i.detail}</div></div></div>`;
    });
  });
  if(summary)html+=`<div class="sh"><span class="st">${t('siSummaryTitle')}</span></div><div class="sbox">${summary}</div>`;
  document.getElementById('siRc').innerHTML=html;
  return{overall};
}

function clearSIResult(){
  siParsedRows=[];siFileName='';
  document.getElementById('siUpFile').value='';
  document.getElementById('siUpBox').classList.remove('has');
  document.getElementById('siUpName').textContent=t('siUpDefault');
  document.getElementById('siRowsInfo').style.display='none';
  document.getElementById('siResult').style.display='none';
  document.getElementById('siRc').innerHTML='';
  updateSiBtn();
}

// ── FD render ──
function parseAndRender(raw,invNo,lc,tab){
  const checkLines=raw.split('\n').filter(l=>/^\[(OK|NG|WARN)\]/.test(l.trim()));
  const docLines=raw.split('\n').filter(l=>l.trim().startsWith('DOCS:'));
  const tobankM=raw.match(/TOBANK:\s*(.+?)(?=\nSUMMARY:|$)/s);
  const summaryM=raw.match(/SUMMARY:\s*(.+?)(?=\nOVERALL:|$)/s);
  const overallM=raw.match(/OVERALL:\s*(OK|NG|WARN)/);
  const catMap={};
  checkLines.forEach(l=>{
    const m=l.trim().match(/^\[(OK|NG|WARN)\]\s*(.+?)\s*>\s*(.+?)\s*\|\s*(.*)$/);
    if(!m)return;
    const[,status,cat,title,detail]=m;
    if(!catMap[cat])catMap[cat]=[];
    catMap[cat].push({status,title,detail});
  });
  const docs=docLines.map(l=>{const p=l.replace(/^DOCS:\s*/,'').split('|').map(s=>s.trim());return{name:p[0]||'',lc:p[1]||'-',fd:p[2]||'-',status:p[3]||'WARN'};});
  const overall=overallM?overallM[1]:'WARN';
  const tobank=tobankM?tobankM[1].trim():'';
  const summary=summaryM?summaryM[1].trim():'';
  let ok=0,ng=0,warn=0;
  Object.values(catMap).forEach(items=>items.forEach(i=>{if(i.status==='OK')ok++;else if(i.status==='NG')ng++;else warn++;}));
  const oc=overall==='OK'?'#22c55e':overall==='NG'?'#ef4444':'#f59e0b';
  const oe=overall==='OK'?'✅':overall==='NG'?'❌':'⚠️';
  let html=`<div class="verdict"><span style="font-size:1.8rem">${oe}</span>
    <div><div class="v-text" style="color:${oc}">${t('verdict',overall)}</div>
    <div class="v-sub">${lc.contractNo} | ${lc.country}${invNo?' | Invoice: '+invNo:''}</div></div></div>
    <div class="srow">
      <div class="sc"><div class="sn ok">${ok}</div><div class="sl">${t('scoreOK')}</div></div>
      <div class="sc"><div class="sn ng">${ng}</div><div class="sl">${t('scoreNG')}</div></div>
      <div class="sc"><div class="sn warn">${warn}</div><div class="sl">${t('scoreWarn')}</div></div>
    </div>`;
  Object.entries(catMap).forEach(([cat,items])=>{
    const cn=items.filter(i=>i.status==='NG').length,cw=items.filter(i=>i.status==='WARN').length;
    const bh=cn>0?`<span class="badge b-ng">NG ${cn}</span>`:cw>0?`<span class="badge b-w">${LANG==='ko'?'요확인':'要確認'} ${cw}</span>`:`<span class="badge b-ok">OK</span>`;
    html+=`<div class="sh"><span class="st">${cat}</span>${bh}</div>`;
    items.forEach(i=>{
      const cl=i.status==='OK'?'ok':i.status==='NG'?'ng':'warn';
      const ic=i.status==='OK'?'✅':i.status==='NG'?'❌':'⚠️';
      html+=`<div class="ci ${cl}"><span style="font-size:.9rem;flex-shrink:0">${ic}</span>
        <div><div class="ctit">${i.title}</div><div class="cdesc">${i.detail}</div></div></div>`;
    });
  });
  if(docs.length){
    html+=`<div class="sh"><span class="st">${t('docsTitle')}</span></div>
    <div class="card" style="padding:9px"><table><tr><th>${t('docName')}</th><th>${t('docLC')}</th><th>${t('docFD')}</th><th>${t('docStatus')}</th></tr>`;
    docs.forEach(d=>{
      const sc=d.status==='OK'?'var(--ok)':d.status==='NG'?'var(--ng)':'var(--warn)';
      const si=d.status==='OK'?'✅':d.status==='NG'?'❌':'⚠️';
      html+=`<tr><td>${d.name}</td><td style="text-align:center">${d.lc}</td><td style="text-align:center">${d.fd}</td><td style="text-align:center;color:${sc}">${si}</td></tr>`;
    });
    html+='</table></div>';
  }
  if(tobank)html+=`<div class="sh"><span class="st">${t('tobankTitle')}</span></div><div class="sbox">${tobank}</div>`;
  if(summary)html+=`<div class="sh"><span class="st">${t('summaryTitle')}</span></div><div class="sbox">${summary}</div>`;
  document.getElementById(tab==='fd'?'fdRc':'siRc').innerHTML=html;
  return{overall};
}

// ── 이력 ──
function renderHist(){
  const el=document.getElementById('histList');
  if(!el)return;
  if(!DB.history.length){el.innerHTML=`<div class="empty">${t('histEmpty')}</div>`;return;}
  el.innerHTML=DB.history.map((h,i)=>{
    const vc=h.overall==='OK'?'var(--ok)':h.overall==='NG'?'var(--ng)':'var(--warn)';
    const ve=h.overall==='OK'?'✅':h.overall==='NG'?'❌':'⚠️';
    const tb=h.type==='SI'?`<span class="si-badge" style="margin-right:4px">SI</span>`:`<span class="lc-badge" style="margin-right:4px">FD</span>`;
    return`<div class="hist-item" onclick="showHistDetail(${i})">
      <div class="hist-head">
        <div>${tb}<span class="hist-title">📄 ${h.contractNo} — ${h.invNo}</span>
        <div class="hist-meta">${h.country} | ${h.checkedAt}</div></div>
        <div style="font-size:.75rem;font-weight:700;color:${vc}">${ve} ${h.overall}</div>
      </div></div>`;}).join('');
}

function showHistDetail(i){
  const h=DB.history[i];
  if(h.type==='SI'){
    document.getElementById('siRc').innerHTML=h.html;
    document.getElementById('siResult').style.display='block';
    switchTab('si');
    setTimeout(()=>document.getElementById('siResult').scrollIntoView({behavior:'smooth'}),100);
  } else {
    document.getElementById('fdRc').innerHTML=h.html;
    document.getElementById('fdResult').style.display='block';
    switchTab('fd');
    setTimeout(()=>document.getElementById('fdResult').scrollIntoView({behavior:'smooth'}),100);
  }
}

function clearHist(){
  if(!confirm(t('histClearConfirm')))return;
  DB.history=[];renderHist();
}
